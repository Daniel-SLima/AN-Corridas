name: Gerar APK Android assinado
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Exigir assinatura permanente
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "ERRO: configure ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD; não geraremos APK debug temporário." >&2
            exit 1
          fi
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Usar Android SDK do runner
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Carregar e conferir chave permanente
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 400000 -in .github/primo-release.jks.enc -out app/production-keystore.jks -pass env:ANDROID_KEYSTORE_PASSWORD
          EXPECTED=$(tr -d '\r\n' < .github/PRIMO_SIGNING_SHA256)
          ACTUAL=$(keytool -list -v -keystore app/production-keystore.jks \
            -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d '\r\n')
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo 'ERRO: chave não corresponde à assinatura oficial do Primo.' >&2
            exit 1
          fi
          echo 'Assinatura permanente conferida.'
      - name: Testar cálculos, CSV e XLSX
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compilar APK release assinado
        shell: bash
        run: gradle --no-daemon :app:assembleRelease
      - name: Verificar certificado do APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 26 --print-certs "$APK" > "$RUNNER_TEMP/apk-verification.txt"
          EXPECTED=$(tr -d ':' < .github/PRIMO_SIGNING_SHA256 | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')
          grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED" "$RUNNER_TEMP/apk-verification.txt" >/dev/null || {
            echo 'ERRO: APK não tem a assinatura oficial do Primo.' >&2
            exit 1
          }
          echo 'APK assinado com chave permanente validada.'
      - name: Apagar cópia temporária da chave
        if: always()
        shell: bash
        run: rm -f app/production-keystore.jks
      - name: Publicar APK release
        uses: actions/upload-artifact@v4
        with:
          name: Primo-APK-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
